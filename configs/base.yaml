experiment: {name: base, seed: 42, output_dir: experiments}
data:
  root: ~/Downloads/COD10K-v3        # override with data.root=... (not committed to the repo)
  depth_cache: data/cache/depth      # estimated (pseudo-)depth, generated by scripts/precompute_depth.py
  image_size: 392                    # must be a multiple of 14 (518 = paper default, slower)
  val_fraction: 0.1
  split_seed: 42
  num_workers: 4
  train_limit: null
  val_limit: null
  test_limit: null
depth:
  model: depth-anything/Depth-Anything-V2-Small-hf
  input_size: 518
model:
  backbone: facebook/dinov2-small
  layers: [3, 6, 9, 12]              # 1-based transformer blocks tapped for the multiscale decoder
  embed_dim: 128
  fusion: none                       # none | concat | cross_attn | gated | reliability
  fusion_levels: [0, 1, 2, 3]
  num_heads: 4
  depth_channels: 48
  boundary_head: false
train:
  epochs: 30
  batch_size: 4
  accum_steps: 1
  lr_backbone: 1.0e-5
  lr_head: 1.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 1
  grad_clip: 1.0
  amp: auto                          # auto: bf16 on CUDA, fp32 on MPS/CPU
  backbone_freeze_epochs: 0          # progressive fine-tuning: frozen for N epochs, then unfrozen
  backbone_trainable_blocks: null    # null = all blocks after unfreezing; N = last N blocks only
  depth_dropout: 0.0                 # prob. of dropping depth for a sample (trains RGB-only fallback)
  early_stop_patience: 8
  val_metric: sm                     # sm | wf | em | mae(lower better) | dice | miou
  max_steps_per_epoch: null
  max_bad_steps: 20                  # abort after this many consecutive non-finite losses
loss: {bce: 1.0, dice: 1.0, structure: 0.0, boundary: 0.0}
eval: {threshold: 0.5}
